# RLBot v2 bot config -- points the RLBot GUI at rlbot_agent.py.
#
# RLBot v2 only reads TOML bot configs (see rlbot/config.py's use of tomllib), there's
# no .cfg format anymore -- add this file to the RLBot GUI ("Add" -> browse to this
# file) rather than looking for an ini-style config.
#
# run_command points at the project's own venv so Ashby runs with the same
# torch/CUDA/rlgym_sim install everything else in this repo uses, not whatever
# `python` resolves to globally. On Windows this has to be an absolute path --
# RLBotServer's launcher misreads the "../.." relative traversal as a Windows
# command rather than a path, so the bot process never actually starts. Hardcoded
# to this machine's path; regenerate with os.path.abspath(...) if the repo moves.
# run_command_linux stays relative -- the "../.." issue is Windows-specific.

[settings]
name = "Ashby"
agent_id = "yaiito/ashby"
run_command = "C:\\Users\\Yaiito\\Documents\\Ashby\\.venv\\Scripts\\python.exe C:\\Users\\Yaiito\\Documents\\Ashby\\mind\\rl\\rlbot_agent.py"
run_command_linux = "../../.venv/bin/python rlbot_agent.py"
hivemind = false
